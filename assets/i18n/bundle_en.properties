# ============================================================
# Mushroom Hunt — ЗАГЛУШКА для английского (пустая, только комментарий).
#
# ЗАЧЕМ ФАЙЛ БЕЗ ЕДИНОГО КЛЮЧА?
#
# Это очень коварная ловушка Java-бандлов, укушенная нами 02.11.2026:
# I18NBundle ищет файлы по цепочке: bundle_en -> bundle_<СИСТЕМНАЯ ЛОКАЛЬ> -> bundle.
# Если файл bundle_en.properties НЕ существует, то на машине с русской виндой
# (учебный класс!) запрос «en» провалится дальше — на bundle_ru.properties,
# и игра честно покажет... РУССКИЙ, сколько ни переключай язык в настройках.
# Ошибок при этом ноль — сиди и удивляйся.
#
# Наличие этого пустого файла обрывает цепочку: «en» находит СВОЙ файл,
# ключей в нём нет — и каждый ключ честно берётся из родителя bundle.properties,
# где и живёт английский текст.
#
# Правило на будущее: для КАЖДОГО языка из Localization.SUPPORTED_LANGUAGES
# должен существовать свой bundle_<код>.properties, пусть даже пустой-заглушка.
# ============================================================
